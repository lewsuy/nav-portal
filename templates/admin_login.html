<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理后台登录</title>
{% include "_theme_init.html" %}
<link rel="stylesheet" href="/static/css/style.css">
<style>
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .login-theme-switcher { position: fixed; top: 20px; right: 20px; width: 160px; }
  .login-box {
    width: 320px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px 28px;
  }
  .login-box h1 { font-size: 16px; margin: 0 0 20px; color: var(--text); font-weight: 600; }
  .login-box label { display:block; font-size: 12.5px; color: var(--text-dim); margin-bottom: 6px; }
  .login-box input {
    width: 100%; padding: 9px 10px; margin-bottom: 16px;
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-size: 14px; font-family: var(--font);
  }
  .login-box input:focus { outline: none; border-color: var(--accent-dim); }
  .login-box button {
    width: 100%; padding: 10px; border: none; border-radius: 8px;
    background: var(--accent); color: #0d1117; font-weight: 600; font-size: 14px; cursor: pointer;
  }
  .login-box button:hover { background: var(--accent-dim); }
  .error { color: var(--danger); font-size: 13px; margin-bottom: 14px; }
</style>
</head>
<body>
  <div class="login-theme-switcher">
    {% include "_theme_switcher.html" %}
  </div>
  <div class="login-box">
    <h1>管理后台登录</h1>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post">
      <label>用户名</label>
      <input type="text" name="username" autocomplete="username" required autofocus>
      <label>密码</label>
      <input type="password" name="password" autocomplete="current-password" required>
      <button type="submit">登录</button>
    </form>
  </div>
  <script src="/static/js/theme.js"></script>
</body>
</html>
