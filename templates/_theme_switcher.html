<div class="theme-dropdown">
  <button type="button" class="theme-trigger" id="themeTrigger" aria-haspopup="true" aria-expanded="false" title="主题">
    <span class="theme-trigger-icon">☀️</span>
  </button>
  <div class="theme-menu" id="themeMenu">
    <button type="button" class="theme-menu-item" data-theme-option="light">
      <span class="theme-menu-icon">☀️</span>
      <span class="theme-menu-label">Light</span>
      <span class="theme-check">✓</span>
    </button>
    <button type="button" class="theme-menu-item" data-theme-option="dark">
      <span class="theme-menu-icon">🌙</span>
      <span class="theme-menu-label">Dark</span>
      <span class="theme-check">✓</span>
    </button>
    <button type="button" class="theme-menu-item" data-theme-option="system">
      <span class="theme-menu-icon">💻</span>
      <span class="theme-menu-label">System</span>
      <span class="theme-check">✓</span>
    </button>
  </div>
</div>
