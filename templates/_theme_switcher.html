<div class="theme-switcher" role="group" aria-label="主题切换">
  <button type="button" class="theme-opt" data-theme-option="light" title="亮色">
    <span class="theme-icon">☀️</span>亮色
  </button>
  <button type="button" class="theme-opt" data-theme-option="dark" title="暗色">
    <span class="theme-icon">🌙</span>暗色
  </button>
  <button type="button" class="theme-opt" data-theme-option="system" title="跟随系统">
    <span class="theme-icon">💻</span>系统
  </button>
</div>
